<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>VOLT — تسجيل الدخول</title>
<link rel="icon" href="icon.png" />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Cairo, sans-serif; color: #eef0f4;
  background: radial-gradient(900px 500px at 80% -10%, rgba(255,120,20,.16), transparent 60%), #0a0b0e; }
.box { width: min(420px, 92vw); text-align: center; background: #14161b; border: 1px solid rgba(255,255,255,.08); border-radius: 24px; padding: 36px 28px; }
.box img { width: 104px; filter: drop-shadow(0 0 18px rgba(255,140,30,.45)); }
h1 { margin: 10px 0 4px; font-size: 28px; font-weight: 900; }
p { margin: 0 0 22px; color: #8b93a1; line-height: 1.8; }
button { font: inherit; font-weight: 800; font-size: 17px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
  border: 0; border-radius: 14px; padding: 13px 18px; cursor: pointer; background: #fff; color: #1f1f1f; }
button:disabled { opacity: .6; cursor: default; }
button svg { width: 22px; height: 22px; }
.err { color: #f87171; font-weight: 700; margin-top: 14px; min-height: 1.6em; }
</style>
</head>
<body>
<div class="box">
  <img src="icon.png" alt="" />
  <h1>تسجيل الدخول لفولت</h1>
  <p>سجّل دخول بحساب جوجل بتاعك، وبعدها ارجع للبرنامج.</p>
  <button id="go"><svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>المتابعة بحساب جوجل</button>
  <div id="err" class="err"></div>
</div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

const app = initializeApp({
  apiKey: 'AIzaSyB0g-ENYWyBHY-x3RAjZX3qHE30KpOkY_s',
  authDomain: 'volt-hub-b3e62.firebaseapp.com',
  projectId: 'volt-hub-b3e62',
  appId: '1:603121835880:web:55110b1a0e3b480d8bc0dd',
});
const auth = getAuth(app);
const q = new URLSearchParams(location.search);
// the program puts its local port and a one-time code in the link; keep them across a full-page sign-in
if (q.get('port')) sessionStorage.setItem('volt', JSON.stringify({ port: q.get('port'), state: q.get('state') }));
const ctx = JSON.parse(sessionStorage.getItem('volt') || '{}');
const $ = (id) => document.getElementById(id);
const fail = (m) => { $('err').textContent = m; $('go').disabled = false; };

if (!/^\d{2,5}$/.test(String(ctx.port || '')) || !/^[a-f0-9]{32}$/.test(String(ctx.state || ''))) {
  $('go').disabled = true;
  fail('افتح الصفحة دي من زرار تسجيل الدخول جوه برنامج فولت.');
}

async function backToProgram(user) {
  const rt = user.refreshToken;
  await signOut(auth).catch(() => {});
  sessionStorage.removeItem('volt');
  location.href = `http://127.0.0.1:${ctx.port}/done?state=${ctx.state}&rt=${encodeURIComponent(rt)}`;
}

getRedirectResult(auth).then((r) => r && r.user && backToProgram(r.user)).catch(() => {});

$('go').onclick = async () => {
  $('go').disabled = true;
  $('err').textContent = '';
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  try {
    const r = await signInWithPopup(auth, provider);
    await backToProgram(r.user);
  } catch (e) {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') return signInWithRedirect(auth, provider);
    if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return fail('');
    fail('مقدرتش أسجل الدخول: ' + (e.code || e.message));
  }
};
</script>
</body>
</html>
